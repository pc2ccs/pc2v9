# For all possible .ini entries see pc2v9.ini in the samps directory, or search the pc2 wiki

[client]

# Site 1
server=localhost:50002
# Site 2
#server=localhost:51002
# Site 3
# server=localhost:52002

[server]

# For site 2 and Site 3
#remoteServer=localhost:50002

# For WebTeamInterface server
useSSL=0
wtiport=8080
#wtiport=8443
wtiwsName=/websocket
wtiscoreboardaccount=scoreboard2
wtiscoreboardpassword=scoreboard2

# Omit WTI scoreboard rows for teams with no counted submissions (accepted, rejected, or pending).
# Default is false when this entry is absent. Restart the WTI after changing it.
# suppressScoreboardZeros=false

# Omit the Scoreboard tab from the WTI. Default is false when absent.
# hideWTIScoreboard=false
# When the tab is shown, limit the table to the logged-in team and leave the rank column blank.
# showOnlyMeOnWTIScoreboard=false

# When set to an http or https URL, the WTI login screen links there so users can request a PC2 account.
# Absent or empty leaves the login screen unchanged. Restart the WTI after changing it.
# showRegistrationURL=https://example.com/register

# For SSL
keyStoreFilePath=/Users/Public/WebTeamInterface-1.2/wtikeystore.jks
keyStorePassword=contest

# eof 
