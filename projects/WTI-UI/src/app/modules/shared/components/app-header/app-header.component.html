<header>
    <div class='logo-container'>
        <img src='/assets/PC2Logo.png' alt='PC^2 Logo'>
        <img src='/assets/VerticalBar.png' alt='VerticalBar'>
        <img src='/assets/icpc-banner.png' alt='ICPC Programming Contest Logo'>
    </div>
    
    <div class='clock-container' *ngIf='showClocks'> 
       	  Elapsed: <br />
          <!-- {{ getElapsedSecs() }} <br /> This will display the raw number of elapsed seconds, for debugging purposes -->
          <!-- "displayTime" is the "name" of the DisplayTimePipe service which produces a string,
       	  		formatted as Days:Hours:Minutes:Seconds, from a given time specified as a number of seconds. -->
          {{ getElapsedSecs() | displayTime }}
    </div>
    
    <div class='teamid-container' *ngIf='showTeamId'>
    	<P>TEAM {{teamId}}</P>
    </div>
    
    <nav *ngIf='showLinks'>
        <a routerLink='/runs' routerLinkActive='active'>Runs</a>
        <a routerLink='/clarifications' routerLinkActive='active'>Clarifications</a>
        <a routerLink='/options' routerLinkActive='active'>Options</a>
        <a routerLink='/scoreboard' routerLinkActive='active'>Scoreboard</a>
        <a routerLink='/logout'>Logout</a>
    </nav>
    
	<div class='clock-container' *ngIf='showClocks'> 
    	Remaining: <br />
    	  <!-- Show remaining time in RED if contest has ended; otherwise white.
    	       TODO: this is inefficient; it calls the same function twice. 
    	       Should use a variable... -->
          <span [style.color]="getRemainingSecs()<=0 ? 'red' : 'white'">
              {{ getRemainingSecs() | displayTime }}
          </span>
    </div>
    
</header>
