<header>
    <div class='logo-container'>
        <img src='/assets/PC2Logo.png' alt='PC^2 Logo'>
        <img src='/assets/VerticalBar.png' alt='VerticalBar'>
        <img src='/assets/icpc-banner.png' alt='ICPC Programming Contest Logo'>
    </div>
    
    <div class='clock-container' *ngIf='showClocks'> 
       	  Elapsed: <br />
       	  
       	  <div> {{ elapsedSecs }}</div>
       	  <!-- <div>{{ myUpCounter * 1000 | date: "HH':'MM':'SS" }}</div> -->
       	  <!-- <div>{{ getElapsedTimeAsDate() | date: "ddd:HH:mm:ss" }}</div> -->
       	  <div>{{ getElapsedTimeAsDate() | elapsedTime }}</div>
       	  <!-- <div>{{ getElapsedTimeAsDate() | date: 'medium' }}</div> -->
       	  <!-- 
       	  <countUp [startVal]="0" [endVal]="3630" >
       	  -->
       	  
       	  <!-- 
      	  <countUp [startVal]="0" [endVal]="3630" format= "HH:mm:ss">
      	  -->
      	  
       	  <!-- 
       	  <countUp [config]="{ startVal:0,  endVal:3630,  format: 'HH:mm:ss' }">
       	  <!-- probably need something like the following to support insertion of contest time data into the counter...
       	  <ng-template #template let-time>{{time.days}}d {{time.hours}}h {{time.minutes}}m {{time.seconds}}s</ng-template>
       	  -->
       	  
       	  <!-- 
       	  </countUp>
       	  -->
    </div>
    
    <div class='teamid-container' *ngIf='showTeamId'>
    	<P>TEAM {{teamId}}</P>
    </div>
    
    <nav *ngIf='showLinks'>
        <a routerLink='/runs' routerLinkActive='active'>Runs</a>
        <a routerLink='/clarifications' routerLinkActive='active'>Clarifications</a>
        <a routerLink='/options' routerLinkActive='active'>Options</a>
        <a routerLink='/scoreboard' routerLinkActive='active'>Scoreboard</a>
        <a routerLink='/logout'>Logout</a>
    </nav>
    
    <div class='clock-container' *ngIf='showClocks'> 
    	Remaining: <br />
    	<countdown [config]="{ leftTime: 3600, format: 'HH:mm:ss', message: 'Remaining Time is up!' }"></countdown>
    </div>
    
</header>
