<div class='filter-table-container'>

    <div class='table-container scoreboard-table'>
    	<!-- Add a group-selection dropdown list, but only if there is more than one group in the contest containing teams -->
        <div class='scoreboard-controls' *ngIf="groupOptions.length > 1">
            <label class="scoreboard-group-filter">
                <span class="scoreboard-group-filter-label">Group</span>
                <!--
                  The following "select" defines the group selection drop-down list.
                  The line
                      [ngModel]="selectedGroupExternalId"
                      forces Angular to display the "selectedGroupExternalId" in the drop-down, but does NOT automatically
                      update "selectedGroupExternalId" in the component when the user changes the selection (that update is 
                      done when method "onGroupFilterChange() is called.
                  The line 
                      (ngModelChange)="onGroupFilterChange($event)"
                      says "whenever the Angular model changes, call method "onGroupFilterChange()", passing the new model value
                      (a string which is the selected drop-down option's value)".
                  The line 
                      (change)="blurGroupFilter($event)"
                      says "whenever the BROWSER generates a 'change event' (for example, when the user selects a new drop-down 
                      option), call method "blurGroupFilter()", passing it the browser (DOM) event.  (This event is used in
                      method blurGroupFilter() to remove keyboard focus from the drop-down so that, for example, up/down arrow
                      keys continue to scroll the scoreboard table instead of the dropdown list choices.)
                 -->
                <select
                    [ngModel]="selectedGroupExternalId"
                    (ngModelChange)="onGroupFilterChange($event)"
                    (change)="blurGroupFilter($event)"
                    name="scoreboardGroup"
                    class="scoreboard-group-select">
                    <!-- add an "All Teams" option to the dropdown list if appropriate -->
                    <option *ngIf="showAllTeamsOption" value="">All teams</option>
                    <!-- add each separate group name to the dropdown list (the "value" in each option is that group's External Id),
                    	while the text which is DISPLAYED for each option is the group's "displayNam") -->
                    <option *ngFor="let g of groupOptions; trackBy: trackGroupOption" [value]="g.externalId">{{ g.displayName }}</option>
                </select>
            </label>
        </div>

		<table style="border-collapse: separate; border-spacing: 6px 6px;">
            <tr>
                <th>Rank</th>
                <th>Team</th>
                <th *ngFor="let item of visibleProblemDetailHeaders" 
                	[ngStyle]="{
                		'text-align': 'center',
                		'padding': '2px 2px',
                		'background-color': rgbToCss(item.color),
                		'color': item.textColor,
                		'cursor': 'pointer' 
                	}">
                	<a [href]="isContestStarted() ? item.url : null" 
                			(click)="onLinkClick($event, item.url)" 
                			target="_blank" 
                			class="problem-writeup-link" >
    					{{ item.label }}
  					</a>

                </th>
                <th style="text-align: center">Solved</th>
                <th style="text-align: center">Score</th>
            </tr>
            <!-- loop through all teamStandings, tracking in-group index -->
            <tr *ngFor="let team of teamStandings; let i = index">
            
            	<!-- display next team's rank WITHIN THE CURRENTLY SELECTED GROUP -->
                <td style="text-align: center">{{ getDisplayRank(team, i) }}</td>
                
                <!-- display team name -->
                <td>{{ team.teamName }}</td>
                
  				<!-- Render problem detail cells, but only if the contest has started -->
  				<ng-container *ngIf="isContestStarted()">
    				<td *ngFor="let problem of team.problemSummaryInfo"
        				style="text-align: center; white-space: nowrap;"
        				[ngClass]="{
           					'fts': problem.isSolved && problem.fts,
          					'yes': problem.isSolved,
          					'no': !problem.isSolved && problem.attempts > 0 && !problem.isPending,
          					'pending': !problem.isSolved && problem.isPending
        					}"
        				>

      					<ng-container *ngIf="problem.isSolved; else notSolved">
        					{{ problem.attempts }}/{{ problem.solutionTime }}
      					</ng-container>

      					<ng-template #notSolved>
        					{{ problem.attempts }}/--
      					</ng-template>
    				</td>
  				</ng-container>
                	
                <td style="text-align: center">{{ team.solved }}</td>
                <td style="text-align: center">{{ team.points }}</td>
            </tr>
        </table>
    </div>
</div>
