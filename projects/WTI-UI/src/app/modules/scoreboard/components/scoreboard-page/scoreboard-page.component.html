<div class='filter-table-container'>

    <div class='table-container scoreboard-table'>
		<table style="border-collapse: separate; border-spacing: 6px 6px;">
            <tr>
                <th>Rank</th>
                <th>Team</th>
                <th *ngFor="let item of visibleProblemDetailHeaders" 
                	[ngStyle]="{
                		'text-align': 'center',
                		'padding': '2px 2px',
                		'background-color': rgbToCss(item.color),
                		'color': item.textColor,
                		'cursor': 'pointer' 
                	}">
                	<a [href]="isContestStarted() ? item.url : null" 
                			(click)="onLinkClick($event, item.url)" 
                			target="_blank" style="color: inherit; text-decoration: none; display: block;">
    					{{ item.label }}
  					</a>

                </th>
                <th style="text-align: center">Solved</th>
                <th style="text-align: center">Score</th>
                <th></th>
            </tr>
            <tr *ngFor= 'let team of teamStandings' >
                <td style="text-align: center">{{ team.rank }}</td>
                <td>{{ team.teamName }}</td>
                
  				<!-- Render problem detail cells, but only if the contest has started -->
  				<ng-container *ngIf="isContestStarted()">
    				<td *ngFor="let problem of team.problemSummaryInfo"
        				style="text-align: center; white-space: nowrap;"
        				[ngClass]="{
          					'fts': problem.isSolved && (problem.solutionTime <= getBestSolutionTime(problem.problemId)),
          					'yes': problem.isSolved,
          					'no': !problem.isSolved && problem.attempts > 0 && !problem.isPending,
          					'pending': !problem.isSolved && problem.isPending
        					}"
        				>

      					<ng-container *ngIf="problem.isSolved; else notSolved">
        					{{ problem.attempts }}/{{ problem.solutionTime }}
      					</ng-container>

      					<ng-template #notSolved>
        					{{ problem.attempts }}/--
      					</ng-template>
    				</td>
  				</ng-container>
                	
                <td style="text-align: center">{{ team.solved }}</td>
                <td style="text-align: center">{{ team.points }}</td>
            </tr>
        </table>
    </div>
</div>
